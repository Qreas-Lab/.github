name: Error
description: Algo no funciona como debería
title: "[Error] "
body:
  - type: markdown
    attributes:
      value: |
        No incluyas credenciales, datos personales ni información de clientes
        en la descripción, capturas o registros.
  - type: input
    id: componente
    attributes:
      label: Producto o componente
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Qué ocurre
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado y resultado obtenido
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Navegador, sistema operativo, versión o rama.
